      ${links ? `<div class="head-links">${links}</div>` : ""}
    </div>
    ${views.length > 1
      ? `<div class="tabs" role="tablist" aria-label="เลือกมุมมอง">${views.map((v, j) =>

  root.appendChild(sec);

  const panel = sec.querySelector(".canvas");
  const render = j => {
    const v = views[j];
    panel.classList.toggle("gallery", !!v.gallery);
    panel.innerHTML = v.items.map((it, k) => `
      <figure class="frame">
        <figcaption class="frame-label">${esc(it.label || "")}</figcaption>

    panel.querySelectorAll("img").forEach(img => {
      img.addEventListener("error", () => makePlaceholder(img), { once: true });
      if (img.complete && img.naturalWidth === 0) makePlaceholder(img);
    });
    panel.querySelectorAll(".frame button").forEach(b =>
      b.addEventListener("click", () => {
        if (!b.querySelector("img")) return; // ยังไม่มีรูป ไม่ต้องเปิดดูขนาดใหญ่

  };
  sec.querySelectorAll("button.tab").forEach(t => t.addEventListener("click", () => {
    sec.querySelectorAll("button.tab").forEach(x => x.setAttribute("aria-selected", String(x === t)));

  }));

// กดรูปเพื่อดูขนาดใหญ่
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lb-img");
const lbCap = document.getElementById("lb-caption");
const lbPrev = document.getElementById("lb-prev");
const lbNext = document.getElementById("lb-next");
let lbItems = [], lbIndex = 0, lbTitle = "", lastFocus = null;

function showLb() {
  const it = lbItems[lbIndex];
  lbImg.src = it.src;
  lbImg.alt = lbTitle + ": " + (it.label || "");
  lbCap.textContent = `${lbTitle} | ${it.label || ""} (${lbIndex + 1}/${lbItems.length})`;
  lbPrev.style.display = lbNext.style.display = lbItems.length > 1 ? "" : "none";
}
function openLightbox(items, k, title) {
  lastFocus = document.activeElement;
  lbItems = items; lbIndex = k; lbTitle = title;
  showLb();
  lb.classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("lb-close").focus();
}
function closeLightbox() {
  lb.classList.remove("open");
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}
const step = d => { lbIndex = (lbIndex + d + lbItems.length) % lbItems.length; showLb(); };
document.getElementById("lb-close").onclick = closeLightbox;
lbPrev.onclick = () => step(-1);
lbNext.onclick = () => step(1);
lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
